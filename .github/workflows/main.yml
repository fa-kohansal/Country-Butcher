name: Deploy to Production

on:
  push:
    branches:
      - main  

jobs:
  build:
    runs-on: ubuntu-latest  

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16' 

      - name: Install dependencies
        run: |
          npm install 

      - name: Build project (optional)
        run: |
         npm run build
      - name: Deploy
        run: |
          ssh user@server "git@github.com:fa-kohansal/Country-Butcher.git" echo "deploying the app"
